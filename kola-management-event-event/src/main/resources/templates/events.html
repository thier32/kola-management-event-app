<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.w3.org/1999/xhtml"
      xmlns:sec="http://www.w3.org/1999/xhtml"

      layout:decorate="~{layouts/main_layout.html}"
>
<head>
    <link rel="stylesheet" href="/css/event.css">
</head>

<body>

<div layout:fragment="content" >
    <div th:if="${message != null}" class="alert alert-danger alert-dismissible fade show text-center message"
         role="alert">
        [[${message}]]
        <button type="button" class="close btn-sm" data-dismiss="alert" aria-label="Close">
            <span aria-hidden="true">×</span>
        </button>
    </div>
    <div th:switch="${eventData.listElements}">
        <p>
            <a sec:authorize="hasRole('ADMIN')" href="/events/add" class="btn btn-primary"><i
                    class="fas fa-user-plus ml-2"> Add Event</i></a>
        </p>
        <div class="col">
            <h2 th:case="null">No Event yet!</h2>
            <div th:case="*">
                <div class="tag-event">
                    <span>Type of event</span>
                    <div class="tag-event-filter">
                        <a th:each="key :${eventData.keys}"  th:text="${key}"  th:href="@{'/events/list/' + ${#strings.toLowerCase(key)}}"></a>
                    </div>
                </div>
                <table class="styled-table">
                    <thead>
                    <tr>
                        <th>Event Name</th>
                        <th>Event Venue</th>
                        <th>Event Start</th>
                        <th>Event Description</th>
                        <th>Event Capacity</th>
                        <th>Number people booked</th>
                        <th colspan="4">Actions</th>
                    </tr>
                    </thead>
                    <tfoot>
                    </tfoot>
                    <tbody>
                    <tr th:each="event : ${eventData.listElements}">
                        <!--                         <td th:text="${parameter.id}">serzr</td>-->
                        <td th:text="${event.eventName}"></td>
                        <td th:text="${event.eventVenue}"></td>
                        <td th:text="${event.eventStartDate}"></td>
                        <td th:text="${event.eventDescription}"></td>
                        <td th:text="${event.eventCapacity}"></td>
                        <td th:text="${event.eventOccupation}"></td>
                        <td>
                            <a sec:authorize="hasRole('ADMIN')" th:href="@{'/events/edit/' + ${event.eventId}}"  title="Edit">
                                <i class="fa fa-edit" aria-hidden="true"></i>
                            </a>
                        </td>
                        <td>

                            <a th:if=
                            "${event.eventStatus != null && (event.eventStatus.toString() == 'CREATED'
                            || event.eventStatus.toString() == 'UNPUBLISHED'  || event.eventStatus.toString() == 'CANCELED'
                            )}"

                               sec:authorize="hasRole('ADMIN')" th:href="@{'/events/publish/' + ${event.eventId}}"  title="Publish"
                            >
                                <i class="fa fa-upload" aria-hidden="true"></i>
                            </a>
                            <a th:if="${event.eventStatus != null && event.eventStatus.toString() == 'PUBLISHED'}"
                               sec:authorize="hasRole('ADMIN')" th:href="@{'/events/unpublish/' + ${event.eventId}}"  title="Publish"
                            >
                                <i class="fa fa-download" aria-hidden="true"></i>
                            </a>
                        </td>
                        <td>
                            <a sec:authorize="hasRole('ADMIN')" th:href="@{'/events/cancel/' + ${event.eventId}}"  title="Cancel">
                                <i class="fa fa-cancel" aria-hidden="true"></i>
                            </a>
                        </td>
                        <td>
                            <a sec:authorize="!hasRole('ADMIN')" th:href="@{'/events/book/' + ${event.eventId}}"  title="Book a spot"
                            ><i class="fa fa-bookmark-o" aria-hidden="true"></i>
                            </a>

<!--                            <a th:if= "${eventSpot.eventSpotStatus != null && eventSpot.eventSpotStatus.toString() == 'BOOKED'}" th:href="@{'/eventspot/unbook/' + ${eventSpot.eventSpotId}}"  title="Unbook">-->
<!--                                <i class="fa fa-bookmark-o"></i>-->
<!--                            </a>-->
<!--                            <a th:unless="${eventSpot.eventSpotStatus != null && eventSpot.eventSpotStatus.toString() == 'BOOKED'}" th:href="@{'/eventspot/book/' + ${eventSpot.eventSpotId}}"  title="Book">-->
<!--                                <i class="fa fa-bookmark" aria-hidden="true"></i>-->
<!--                            </a>-->


                        </td>
                    </tr>
                    </tbody>
                </table>

                <nav aria-label="...">
                    <ul class="pagination">
                        <li class="page-item" th:classappend="${eventData.currentPage==1} ? disabled">
                            <a class="page-link" th:href="@{'/events/page/'+${eventData.currentPage-1}}"
                               aria-label="Previous">
                                <span aria-hidden="true">&laquo;</span>
                                <span class="sr-only">Previous</span>
                            </a>
                        </li>
                        <li class="page-item" th:classappend="${eventData.currentPage==i} ? active" th:each="i: ${#numbers.sequence(1, eventData.numberPage)}">
                            <a class="page-link"  th:href="@{|/events/page/${i}|}"
                               th:text="${i}"
                               ></a>
                        </li>
                        <li class="page-item" th:classappend="${eventData.currentPage==eventData.numberPage} ? disabled">
                            <a class="page-link" th:href="@{'/events/page/'+${eventData.currentPage+1}}"
                               aria-label="Next">
                                <span aria-hidden="true">&raquo</span>
                                <span class="sr-only">Next</span>
                            </a>
                        </li>
                    </ul>
                </nav>
            </div>
        </div>
    </div>
</div>
</body>
