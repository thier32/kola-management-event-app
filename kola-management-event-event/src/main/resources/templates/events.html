<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.w3.org/1999/xhtml"
      layout:decorate="~{layouts/main_layout.html}"
>

<body>

<div layout:fragment="content" >
    <div th:if="${message != null}" class="alert alert-danger alert-dismissible fade show text-center message"
         role="alert">
        [[${message}]]
        <button type="button" class="close btn-sm" data-dismiss="alert" aria-label="Close">
            <span aria-hidden="true">×</span>
        </button>
    </div>
    <div th:switch="${eventData.listElements}">
        <p>
            <a href="/events/add" class="btn btn-primary"><i
                    class="fas fa-user-plus ml-2"> Add Event</i></a>
        </p>
        <div class="col">
            <h2 th:case="null">No Event yet!</h2>
            <div th:case="*">
                <div class="row">
                    <div th:each="key :${eventData.keys}" class="block">
                    </div>
                </div>
                <table class="table table-striped table-responsive-md">
                    <thead>
                    <tr>
                        <th>Name</th>
                        <th>Service</th>
                        <th>Slug</th>
                        <th>Value</th>
                        <th colspan="2">Actions</th>
                    </tr>
                    </thead>
                    <tfoot>
                    <tr>
                        <td>
                            <select>
                                <option th:each="siz : ${size}" th:text=${siz}  ></option>
                            </select>
                        </td>
                    </tr>
                    </tfoot>
                    <tbody>
                    <tr th:each="event : ${eventData.listElements}">
                        <!--                         <td th:text="${parameter.id}">serzr</td>-->
                        <td th:text="${event.eventName}"></td>
                        <td th:text="${event.eventVenue}"></td>
                        <td th:text="${event.eventDescription}"></td>
                        <td th:text="${event.eventId}"></td>
                        <td>
                            <a class="fa fa-regular fa fa-square icon-dark"
                               th:href="@{'/events/edit/' + ${event.eventId}}"  title="Editer"

                            ></a>
                            <!--                             <a class="btn btn-primary"><i class="fa fa-user-edit ml-2"></i></a>-->
                        </td>
                        <td><a class="btn btn-primary"><i class="fa fa-user-times ml-2"></i></a></td>
                    </tr>
                    </tbody>
                </table>

                <nav aria-label="...">
                    <ul class="pagination">
                        <li class="page-item" th:classappend="${eventData.currentPage==1} ? disabled">
                            <a class="page-link" th:href="@{'/events/page/'+${eventData.currentPage-1}}"
                               aria-label="Previous">
                                <span aria-hidden="true">&laquo;</span>
                                <span class="sr-only">Previous</span>
                            </a>
                        </li>
                        <li class="page-item" th:each="i: ${#numbers.sequence(1, eventData.numberPage)}">
                            <a class="page-link" th:href="@{|/events/page/${i}|}"
                               th:text="${i}"
                               th:class="page-link" th:classappend="${eventData.currentPage==i} ? active"></a>
                        </li>
                        <li class="page-item" th:classappend="${eventData.currentPage==eventData.numberPage} ? disabled">
                            <a class="page-link" th:href="@{'/events/page/'+${eventData.currentPage+1}}"
                               aria-label="Next">
                                <span aria-hidden="true">&raquo</span>
                                <span class="sr-only">Next</span>
                            </a>
                        </li>
                    </ul>
                </nav>
            </div>
        </div>
    </div>
</div>
</body>
