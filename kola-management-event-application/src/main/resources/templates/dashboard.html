<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.w3.org/1999/xhtml"
      layout:decorate="~{layouts/main_layout.html}"
>

<body>
<div  layout:fragment="content" >

    <div class="card-columns" >
        <div th:id="dashboard" th:fragment="dashboard">
        <div th:each="serviceName : ${servicesName}">
            <div th:switch="${service}">
                <div th:case="null" th:id="@{|container_card_view_${serviceName}|}"
                     style="margin-bottom: 5px">
                    <div style="background: lightgrey; height: 250px">
                        <span class="spinner-border" style="font-size:24px"></span>&nbsp;&nbsp;Loading...
                        <p></p>
                    </div>
                <div>
                <div th:case="*">
                    <div  class="card"  th:fragment="divBloc(service,time)">
<!--                        <img src="..." class="card-img-top" alt="...">-->
                        <div class="card-body">
                            <h5 class="card-title" th:text="${service}"></h5>
                            <div class="text-muted" th:text="${time}"></div>
                            <div>
                            <table>
                                <tr th:each="responseE : ${response}">
                                    <td th:text="${responseE.key}"></td>
                                    <td> </td>
                                    <td th:text="${responseE.value}"></td>
                                </tr>
                            </table>
                            </div>
                        </div>
                    </div>
               </div>
            </div>
          </div>
         </div>
        </div>
    </div>
    </div>
</div>
</body>
