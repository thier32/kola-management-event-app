spring.application.title=Kola Management System
spring.application.version=2.0
spring.application.name=Kola Management System
server.port=8081
spring.datasource.url=jdbc:h2:file:~/.kola/data1/kola_management_bd;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.h2.console.enabled=true
logging.level._org.springframework.web.servlet.HandlerMapping.Mappings: debug
kola.event.management.folder.event.images=/images/events/
kola.event.management.folder.eventspot.images=/images/spots/
server.error.path=/error

