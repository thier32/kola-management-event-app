<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      >
<head>
    <meta charset="UTF-8">
    <title>Registration and Login System</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" integrity="sha512-iecdLmaskl7CVkqkXNQ/ZH/XLlvWZOJyj7Yy7tcenmpD1ypASozpmT/E0iPtmFIB46ZmdtAc9eNBvH0H/ZpiBw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <script src="https://kit.fontawesome.com/c4255e24a8.js"
            crossorigin="anonymous"></script>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="container">
    <div class="form-box">
        <h1 id="title" th:text="${isRegister} ? 'Sign Up' : 'Sign In'"></h1>
        <div id="message" th:if="${param.error}">
            <div class="alert alert-danger">Invalid Email or Password</div>
        </div>
        <div id="messages" th:if="${message}">
            <div class="alert alert-danger" th:text="${message}"></div>
        </div>
        <form th:action= "${isRegister} ? @{/register} : @{/login}"  role="form"
              method="post"  enctype="multipart/form-data" th:object="${userdto}">
            <div class="input-group">
                <div class="input-field" id="firstNameField" th:if="${isRegister}">
                    <i class="fa-solid fa-user"></i>
                    <input type="text" name="firstname" placeholder="First Name" th:value="*{firstname}"/>
                </div>
                <div class="input-field" id="lastNameField" th:if="${isRegister}">
                    <i class="fa-solid fa-user"></i>
                    <input type="text" name="lastname" placeholder="Last Name" th:value="*{lastname}"/>
                </div>
                <div class="input-field" id="emailField" th:if="${isRegister}">
                    <i class="fa-solid fa-envelope"></i>
                    <input type="text" name="email" placeholder="Email" th:value="*{email}"/>
                </div>
                <div class="input-field forSignup" id="nameField">
                    <i class="fa-solid fa-user"></i>
                    <input type="text" name="username" placeholder="Username" th:value="*{username}"/>
                </div>
                <div class="input-field">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" id="epassword" name="password" th:value="*{password}" placeholder="Password"/>
                    <span class="password-toggle-icon"><i class="fas fa-eye"></i></span>
                </div>
                <div class="input-field" th:if="${isRegister}" id="confirmpasswordField">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" id="confirmpassword" name="confirmpassword" th:value="*{confirmpassword}" placeholder="Confirm Password"/>
                    <span class="cpassword-toggle-icon"><i class="fas fa-eye"></i></span>
                </div>
                <p>Lost password <a href="#">Click here!</a>&nbsp;&nbsp;
                    <span th:if="${isRegister}" id="psignin" class="sign" >Already have an account.<a th:href="@{/login}" id="signinBtn">Sign In!</a></span>
                    <span th:unless="${isRegister}" id="psignup" class="sign">Not yet registered. <a th:href="@{/register}" id="signupBtn">Sign Up!</a></span>
                </p>
            </div>
            <div class="btn-field">
                <button type="submit" id="actionBtn" th:text="${isRegister} ? 'Sign Up' : 'Sign In'"></button>
            </div>
        </form>
    </div>
</div>
<script>
    const confirmPasswordField = document.getElementById("confirmpassword");
    const passwordField = document.getElementById("epassword");
    const togglePassword = document.querySelector(".password-toggle-icon i");
    const togglecPassword = document.querySelector(".cpassword-toggle-icon i");

    togglePassword.addEventListener("click", function () {
        if (passwordField.type === "password") {
            passwordField.type = "text";
            togglePassword.classList.remove("fa-eye");
            togglePassword.classList.add("fa-eye-slash");
        } else {
            passwordField.type = "password";
            togglePassword.classList.remove("fa-eye-slash");
            togglePassword.classList.add("fa-eye");
        }
    });
    if (togglecPassword != null){
        togglecPassword.addEventListener("click", function () {
            if (confirmPasswordField.type === "password") {
                confirmPasswordField.type = "text";
                togglecPassword.classList.remove("fa-eye");
                togglecPassword.classList.add("fa-eye-slash");
            } else {
                confirmPasswordField.type = "password";
                togglecPassword.classList.remove("fa-eye-slash");
                togglecPassword.classList.add("fa-eye");
            }
        });
    }

</script>
<!--<script src="/js/script.js"></script>-->
</body>
</html>
