<!doctype html>
<html lang="en" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Balance Admin</title>
    <link rel="stylesheet"
          href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css"
          integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO"
          crossorigin="anonymous">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
    <!--    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous">-->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <link rel="stylesheet" href="/css/custom.css">
</head>
<body>
<div th:replace="fragments/header :: header"></div>
<div class="d-flex">
    <div th:replace="fragments/sidebar :: sidebar"></div>
    <div class="main" layout:fragment="content"></div>
</div>
<div th:replace="fragments/footer :: footer"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js" integrity="sha384-k6d4wzSIapyDyv1kpU366/PK5hCdSbCRGRCMv+eplOQJWyd1fbcAu9OCUj5zNLiq" crossorigin="anonymous"></script>
<script src="/js/script.js"></script>
<script th:inline="javascript">
    $(document).ready(function() {
        // Load fragments
        loadFragments();
    });

    function loadFragments() {
        /*<![CDATA[*/

        var serviceNames = /*[[${servicesName}]]*/ 'default';

        /*]]>
        */
        // Initiate fragment loading after 10 milisconds
        if (serviceNames != null){
            for(var i = 0; i < serviceNames.length; i++){
                var service = serviceNames[i];
                load(service);
            }
        }
    }

    function loadStoreFragments(){
        /*<![CDATA[*/

        var serviceNames = /*[[${servicesName}]]*/ 'default';

        /*]]>
        */
        // Initiate fragment loading after 10 milisconds
        if (serviceNames != null){
            for(var i = 0; i < serviceNames.length; i++){
                var service = serviceNames[i];
                loadStored(service);
            }
        }
    }


    function load(i){
        // Load fragment view 1 and replace container
        $('#container_card_view_'+i).load('/dashboard/fragments/fr_view/'+i, function() {
        });
    }

    function loadStored(i){
        // Load fragment view 1 and replace container
        $('#container_card_view_'+i).load('/dashboard/fragments/fr_view/stored/'+i, function() {
        });
    }


    function onRedirect(link){
        if(link === 'current'){
            $('#dashboard').load('/dashboard/fragments/refresh/view',function(){
                loadFragments();
            });
        }
        if(link === 'preview'){
            $('#dashboard').load('/dashboard/fragments/refresh/preview',function(){
                loadStoreFragments();
            });
        }
    }

</script>
</body>
</html>
